name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: false
        type: string

jobs:
  build-windows:
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.version }}" != "" ]]; then
            echo "tag=v${{ inputs.version }}" >> $GITHUB_OUTPUT
            echo "ver=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            TAG=${GITHUB_REF#refs/tags/}
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "ver=${TAG#v}" >> $GITHUB_OUTPUT
          fi

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@master
        with:
          version: 1.11.1

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          cache: true

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT }}" `
            -DBUILD_TESTS=OFF 2>&1

      - name: Build PDFMark
        shell: pwsh
        run: |
          cmake --build build --config Release

      - name: Package Windows Portable Release
        shell: pwsh
        run: |
          .\scripts\package-windows.ps1 -BuildDir build -OutputDir dist -QtDir "${{ env.QT_ROOT }}"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VER="${{ steps.version.outputs.ver }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/PDFMark-Windows-x64.zip --clobber
          else
            gh release create "$TAG" \
              --title "PDFMark $VER" \
              --notes "PDFMark $VER — 纯绿色免安装，解压后双击 \`PdfMark.exe\` 即可使用。\n\n**使用方法：**\n1. 下载下方 \`PDFMark-Windows-x64.zip\`\n2. 解压到任意目录\n3. 双击 \`PdfMark.exe\` 启动" \
              dist/PDFMark-Windows-x64.zip
          fi
